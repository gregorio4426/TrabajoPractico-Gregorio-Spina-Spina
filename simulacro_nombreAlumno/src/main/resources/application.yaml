spring:
  datasource:
    url: ${GYM_DB_URL:jdbc:mysql://localhost:3306/APPgimnasioBD}
    username: ${GYM_DB_USERNAME}
    password: ${GYM_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
security:
  jwt:
    secret-base64: ${GYM_JWT_SECRET_BASE64}
    ttl: ${GYM_JWT_TTL:PT24H}
    issuer: ${GYM_JWT_ISSUER:gimnasio-api}
  bootstrap:
    enabled: ${GYM_BOOTSTRAP_ADMIN_ENABLED:false}
    email: ${GYM_BOOTSTRAP_ADMIN_EMAIL:}
    password: ${GYM_BOOTSTRAP_ADMIN_PASSWORD:}
  cors:
    allowed-origins: ${GYM_CORS_ALLOWED_ORIGINS:}
server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

# OpenAPI 3.0 conserva nullable y facilita la generación de clientes TypeScript.
springdoc:
  api-docs:
    version: OPENAPI_3_0
